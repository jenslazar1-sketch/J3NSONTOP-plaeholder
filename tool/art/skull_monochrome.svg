<?xml version="1.0" encoding="UTF-8"?>
<!--
  J3NSONTOP BIGGEST MULTITOOL MADE - monochrome silhouette (Android 13+ themed icon). Only alpha matters.
  Original artwork made for this project (see docs/ASSETS.md). It echoes the
  ASCII skull in lib/features/intro/skull_art.dart: angular sockets that slant
  down toward the nose, glowing eyes, the inverted-V nose /_^_\, the hairline
  crack on the upper right of the dome, the |_|_| upper teeth and a separate
  jaw hanging open mid-laugh.
  Palette: background #050507, neon #FF163B, dark red #750C20, text #F4F4F7.
  Rendered to every platform asset by tool/art/render_icons.py.
-->
