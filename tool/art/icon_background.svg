<?xml version="1.0" encoding="UTF-8"?>
<!--
  J3NSONTOP BIGGEST MULTITOOL MADE - app icon background (full bleed).
  Near-black terminal screen: faint neon grid, CRT scanlines, a dark red bloom
  behind the skull and a vignette. Original artwork, see docs/ASSETS.md.
  Used by skull_icon.svg; rendered by tool/art/render_icons.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>J3NSONTOP icon background</title>
  <defs>
    <radialGradient id="bloom" cx="512" cy="492" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#750c20" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#750c20" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#750c20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="512" cy="512" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
    <!-- 64 px terminal grid, centred on the canvas -->
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse" x="32" y="32">
      <path d="M64 0H0V64" fill="none" stroke="#ff163b" stroke-opacity="0.075" stroke-width="2"/>
    </pattern>
    <!-- CRT scanlines: 3 px dark band every 8 px -->
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect y="5" width="8" height="3" fill="#000000" fill-opacity="0.38"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="#050507"/>
  <rect width="1024" height="1024" fill="url(#bloom)"/>
  <rect width="1024" height="1024" fill="url(#grid)"/>
  <rect width="1024" height="1024" fill="url(#scanlines)"/>
  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>
