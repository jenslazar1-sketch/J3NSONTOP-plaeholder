# Manual release builds for J3NSONTOP BIGGEST MULTITOOL MADE.
#
# Run it from the Actions tab ("Release" -> "Run workflow") or with
#   gh workflow run release.yml -f platform=all -f build_type=release -f ios_export_method=ad-hoc
#
# build_type=test     same unsigned / debug-signed test artifacts as CI; no
#                     secrets are read.
# build_type=release  signed builds. Android and iOS FAIL with a list of the
#                     missing secrets instead of silently producing unsigned
#                     builds. Windows is Authenticode-signed only when a
#                     certificate is configured (the summary says which).
# Secrets and how to create them: docs/SIGNING.md. Details: docs/CI.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform(s) to build
        type: choice
        options: [all, android, ios, windows]
        default: all
      build_type:
        description: test = unsigned/debug-signed test builds (no secrets); release = signed builds (needs signing secrets)
        type: choice
        options: [test, release]
        default: test
      ios_export_method:
        description: iOS export (release only). ad-hoc/development = install on registered devices; app-store = TestFlight/App Store only
        type: choice
        options: [ad-hoc, development, app-store, enterprise]
        default: ad-hoc

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '17'
  XCODE_APP: /Applications/Xcode_26.6.app
  ARTIFACT_PREFIX: J3NSONTOP-Multitool

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      full_version: ${{ steps.version.outputs.full_version }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from pubspec.yaml
        id: version
        run: bash scripts/ci/version_outputs.sh

      - name: Decide what to build
        id: plan
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILD_TYPE: ${{ inputs.build_type }}
          IOS_METHOD: ${{ inputs.ios_export_method }}
          FULL_VERSION: ${{ steps.version.outputs.full_version }}
        run: |
          for p in android ios windows; do
            if [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "$p" ]; then echo "$p=true"; else echo "$p=false"; fi
          done | tee -a "$GITHUB_OUTPUT"
          want() { [ "$PLATFORM" = "all" ] || [ "$PLATFORM" = "$1" ]; }
          if [ "$BUILD_TYPE" = "release" ]; then
            android="release-signed APK + AAB (requires ANDROID_* secrets)"
            ios="signed IPA, export method $IOS_METHOD (requires IOS_* secrets)"
            windows="portable ZIP + installer; Authenticode only if WINDOWS_CERTIFICATE_* secrets exist"
          else
            android="debug-signed TEST APK"
            ios="UNSIGNED compile check (not installable)"
            windows="portable ZIP + installer, not code-signed"
          fi
          {
            echo "## Release run: $FULL_VERSION ($BUILD_TYPE)"
            echo
            echo "| Platform | Planned output |"
            echo "| --- | --- |"
            if want android; then echo "| Android | $android |"; else echo "| Android | skipped (platform=$PLATFORM) |"; fi
            if want ios; then echo "| iOS | $ios |"; else echo "| iOS | skipped (platform=$PLATFORM) |"; fi
            if want windows; then echo "| Windows | $windows |"; else echo "| Windows | skipped (platform=$PLATFORM) |"; fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate (format, analyze, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Format, analyze, test
        run: bash scripts/check.sh

  # ---------------------------------------------------------------- Android --
  android-test:
    name: Android test APK (debug-signed)
    needs: [plan, validate]
    if: needs.plan.outputs.android == 'true' && inputs.build_type == 'test'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (locked)
        run: flutter pub get --enforce-lockfile

      - name: Build test APK (debug-signed)
        run: bash scripts/build_android.sh --mode test --out-dir dist

      - name: Upload test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ needs.plan.outputs.version }}-android-test-apk
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/SHA256SUMS
            dist/android-build-info.txt
          if-no-files-found: error
          retention-days: 30

  android-release:
    name: Android release (signed APK + AAB)
    needs: [plan, validate]
    if: needs.plan.outputs.android == 'true' && inputs.build_type == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Android release signing is not configured::Missing repository secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions (docs/SIGNING.md). No unsigned or debug-signed fallback is produced for build_type=release."
            {
              echo "### Android release: NOT BUILT"
              echo
              echo "Missing repository secrets: \`${missing[*]}\` (see docs/SIGNING.md)."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All Android signing secrets are present."

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (locked)
        run: flutter pub get --enforce-lockfile

      - name: Decode and check the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/j3-release.jks"
          umask 077
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$keystore"; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 (see docs/SIGNING.md)."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            echo "::error::The keystore could not be opened with ANDROID_KEYSTORE_PASSWORD or has no alias ANDROID_KEY_ALIAS."
            exit 1
          fi
          echo "Keystore decoded and alias found."

      - name: Build release APK + AAB (fails if signing is incomplete)
        env:
          J3_KEYSTORE_PATH: ${{ runner.temp }}/j3-release.jks
          J3_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          J3_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          J3_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build_android.sh --mode release --out-dir dist

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/j3-release.jks"

      - name: Upload signed APK + AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ needs.plan.outputs.version }}-android-release
          path: |
            dist/*.apk
            dist/*.aab
            dist/*.sha256
            dist/SHA256SUMS
            dist/android-build-info.txt
          if-no-files-found: error
          retention-days: 90

  # -------------------------------------------------------------------- iOS --
  ios-unsigned:
    name: iOS unsigned compile check
    needs: [plan, validate]
    if: needs.plan.outputs.ios == 'true' && inputs.build_type == 'test'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (locked)
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned Runner.app (compile check, NOT installable)
        run: bash scripts/build_ios.sh --unsigned --out-dir dist

      - name: Upload unsigned compile check
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ needs.plan.outputs.version }}-ios-UNSIGNED-compile-check
          path: |
            dist/*-ios-UNSIGNED-compile-check.zip
            dist/*-ios-UNSIGNED-compile-check.zip.sha256
          if-no-files-found: error
          retention-days: 14

  ios-release:
    name: iOS signed IPA
    needs: [plan, validate]
    if: needs.plan.outputs.ios == 'true' && inputs.build_type == 'release'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPORT_METHOD: ${{ inputs.ios_export_method }}
    steps:
      - name: Check iOS signing secrets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID || vars.IOS_TEAM_ID }}
        run: |
          missing=()
          [ -n "$IOS_CERTIFICATE_P12_BASE64" ] || missing+=(IOS_CERTIFICATE_P12_BASE64)
          [ -n "$IOS_CERTIFICATE_PASSWORD" ] || missing+=(IOS_CERTIFICATE_PASSWORD)
          [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] || missing+=(IOS_PROVISIONING_PROFILE_BASE64)
          [ -n "$IOS_TEAM_ID" ] || missing+=("IOS_TEAM_ID (secret or repository variable)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=iOS signing is not configured::Missing: ${missing[*]}. See docs/SIGNING.md. No unsigned IPA is produced for build_type=release."
            {
              echo "### iOS release: NOT BUILT"
              echo
              echo "Missing: \`${missing[*]}\` (see docs/SIGNING.md)."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All iOS signing secrets are present (export method: $EXPORT_METHOD)."

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (locked)
        run: flutter pub get --enforce-lockfile

      - name: Create temporary keychain and decode profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: bash scripts/ci/ios_signing_setup.sh

      - name: Build and verify signed IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID || vars.IOS_TEAM_ID }}
        run: |
          bash scripts/build_ios.sh --signed --export-method "$EXPORT_METHOD" \
            --team-id "$IOS_TEAM_ID" --profile "$J3_IOS_PROFILE_PATH" --out-dir dist

      - name: Upload signed IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ needs.plan.outputs.version }}-ios-${{ env.EXPORT_METHOD }}
          path: |
            dist/*.ipa
            dist/*.ipa.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Delete keychain and provisioning profile
        if: always()
        run: |
          # The secret check runs before the checkout; if the job stopped
          # there, nothing was set up and the script is not on the runner.
          if [ -f scripts/ci/ios_signing_cleanup.sh ]; then
            bash scripts/ci/ios_signing_cleanup.sh
          else
            echo "Nothing to clean up: the job stopped before the repository was checked out."
          fi

  # ---------------------------------------------------------------- Windows --
  windows:
    name: Windows x64 (build, verify, package)
    needs: [plan, validate]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies (locked)
        shell: pwsh
        run: flutter pub get --enforce-lockfile

      - name: Build, verify and package (Authenticode only for release builds with a certificate)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ inputs.build_type == 'release' && secrets.WINDOWS_CERTIFICATE_PFX_BASE64 || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.build_type == 'release' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_PFX_BASE64) {
            if ($env:BUILD_TYPE -eq 'release') {
              $note = 'Windows: not code-signed - WINDOWS_CERTIFICATE_PFX_BASE64 / WINDOWS_CERTIFICATE_PASSWORD are not configured (optional).'
            } else {
              $note = 'Windows: not code-signed (build_type=test).'
            }
            Write-Host "::notice::$note"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "> $note`n"
          }
          ./scripts/build_windows.ps1 -OutDir dist

      - name: Upload portable ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ env.VERSION }}-windows-x64-portable
          path: |
            dist/*-windows-x64-portable.zip
            dist/*-windows-x64-portable.zip.sha256
            dist/windows-build-info.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ env.VERSION }}-windows-x64-setup
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 90

  windows-smoke:
    name: Windows clean-machine smoke (no Flutter)
    needs: [plan, windows]
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download portable ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ env.VERSION }}-windows-x64-portable
          path: artifacts/portable

      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ env.VERSION }}-windows-x64-setup
          path: artifacts/setup

      - name: Smoke test portable + install/uninstall
        shell: pwsh
        run: ./scripts/ci/windows_smoke.ps1 -ArtifactsDir artifacts -OutDir windows-smoke -TimeoutSeconds 120

      - name: Upload smoke reports and installer logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-clean-smoke
          path: windows-smoke/
          if-no-files-found: warn
          retention-days: 14
