; Neon Dungeon - user settings
; Written by the launcher on 2026-09-01. Edit only while the game is closed.
; Lines starting with ; or # are comments.
config_version = 3
profile = default

[Display]
; Window mode: windowed | borderless | fullscreen
mode = borderless
width = 1920
height = 1080
refresh_rate = 144
vsync = true
ui_scale = 1.25
# Brightness in percent (50-150)
brightness = 100
language = en

[Audio]
master_volume = 0.8
music_volume = 0.6
sfx_volume = 0.9
voice_volume = 1.0
mute_when_unfocused = yes
output_device = "Default"

[Gameplay]
difficulty = normal
; Show damage numbers above enemies
damage_numbers = on
auto_pickup = true
camera_shake = 0.5
permadeath = false
tutorial_hints = true
save_slot = 1
# Leave empty for a random dungeon seed
seed =

[Network]
; LAN co-op only - this fictional game never talks to the internet
lan_coop = false
port = 27015
player_name = J3NSONTOP
