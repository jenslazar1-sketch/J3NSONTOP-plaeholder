name: j3nsontop_multitool
description: "J3NSONTOP BIGGEST MULTITOOL MADE - a harmless modding, asset, config and developer multitool."
publish_to: 'none'

# Version shown on the About screen, Android versionName/versionCode,
# iOS CFBundleShortVersionString/CFBundleVersion and Windows file version.
version: 1.0.0+1

# Toolchain tested with: Flutter 3.47.5 (stable) / Dart 3.13.4.
# See docs/TOOLCHAIN.md for the full pinned toolchain.
environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter

  # State management + routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # Platform adapters (public OS APIs only)
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  audioplayers: ^6.8.1

  # Pure-Dart data libraries
  archive: ^4.3.0
  collection: ^1.19.1
  crypto: ^3.0.7
  csv: ^8.0.0
  http: ^1.6.0
  image: ^4.10.1
  path: ^1.9.1
  pub_semver: ^2.2.1
  toml: ^0.18.0
  uuid: ^4.6.0
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/intro/
    - assets/images/
    - assets/sounds/
    - assets/licenses/

  fonts:
    # UI font: Chakra Petch (SIL OFL 1.1) - labels, headings, body.
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch_400Regular.ttf
          weight: 400
        - asset: assets/fonts/ChakraPetch_500Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch_700Bold.ttf
          weight: 700
    # Monospace font: JetBrains Mono (SIL OFL 1.1) - ASCII art, code, paths, logs.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono_400Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono_400Regular_Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/JetBrainsMono_500Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono_700Bold.ttf
          weight: 700
